name: test-matrix
description: >
  Run language-aware tests with coverage, enforce a minimum coverage floor and
  post a short summary. Supports Node.js, Python, Go and Java/Maven.
author: Mugisha Jean Claude

inputs:
  language:
    description: "One of: node, python, go, java"
    required: true
  version:
    description: "Language version"
    required: false
    default: ""
  working-directory:
    required: false
    default: "."
  coverage-floor:
    description: "Minimum coverage percentage to enforce (0 disables)"
    required: false
    default: "0"
  install-cmd:
    description: "Custom install command"
    required: false
    default: ""
  test-cmd:
    description: "Custom test command"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.language == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.version != '' && inputs.version || '22' }}
        cache: npm

    - if: inputs.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.version != '' && inputs.version || '3.12' }}

    - if: inputs.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.version != '' && inputs.version || '1.22' }}

    - if: inputs.language == 'java'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.version != '' && inputs.version || '21' }}

    - name: install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.install-cmd }}" ]; then
          ${{ inputs.install-cmd }}
          exit 0
        fi
        case "${{ inputs.language }}" in
          node)   npm ci ;;
          python) pip install -e .[dev] || pip install -r requirements.txt ;;
          go)     go mod download ;;
          java)   ./mvnw -B -q dependency:go-offline || mvn -B -q dependency:go-offline ;;
        esac

    - name: test with coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.test-cmd }}" ]; then
          ${{ inputs.test-cmd }}
          exit 0
        fi
        case "${{ inputs.language }}" in
          node)   npm test -- --coverage ;;
          python) pip install coverage pytest && coverage run -m pytest && coverage report ;;
          go)     go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1 ;;
          java)   ./mvnw -B verify || mvn -B verify ;;
        esac

    - name: enforce coverage floor
      if: inputs.coverage-floor != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        floor='${{ inputs.coverage-floor }}'
        pct=''
        case "${{ inputs.language }}" in
          go)     pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//') ;;
          python) pct=$(coverage report | tail -1 | awk '{print $NF}' | sed 's/%//') ;;
          *) echo "Coverage floor not yet implemented for ${{ inputs.language }}"; exit 0 ;;
        esac
        echo "coverage: $pct% (floor: $floor%)"
        awk -v p="$pct" -v f="$floor" 'BEGIN { exit (p+0 < f+0) ? 1 : 0 }'
