name: docker-build-push
description: >
  Build a container image with Buildx, sign it with cosign using keyless OIDC,
  and push to the given registry. Emits the full image reference and digest.
author: Mugisha Jean Claude

inputs:
  image:
    description: "Image name without a tag, e.g. ghcr.io/org/app"
    required: true
  context:
    description: "Build context directory"
    required: false
    default: "."
  dockerfile:
    description: "Path to the Dockerfile"
    required: false
    default: "Dockerfile"
  platforms:
    description: "Comma-separated target platforms"
    required: false
    default: "linux/amd64,linux/arm64"
  registry:
    description: "Registry to log in to (empty to skip login)"
    required: false
    default: "ghcr.io"
  registry-username:
    required: false
    default: ${{ github.actor }}
  registry-password:
    required: false
  sign:
    description: "Sign the image with cosign keyless OIDC"
    required: false
    default: "true"
  build-args:
    description: "Newline-separated KEY=VALUE pairs"
    required: false
    default: ""
  provenance:
    description: "Attach SLSA provenance"
    required: false
    default: "true"

outputs:
  image:
    description: "Full image reference with tag"
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: "Image digest (sha256:...)"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - if: inputs.registry != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}

    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        provenance: ${{ inputs.provenance }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - if: inputs.sign == 'true'
      uses: sigstore/cosign-installer@v3

    - if: inputs.sign == 'true'
      shell: bash
      run: |
        # Sign every tag the build produced, using the image digest to pin.
        for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
          ref="${tag}@${{ steps.build.outputs.digest }}"
          echo "Signing $ref"
          cosign sign --yes "$ref"
        done
