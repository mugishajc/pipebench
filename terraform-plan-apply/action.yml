name: terraform-plan-apply
description: >
  Run `terraform plan` and post a summary comment on pull requests. On push to
  the default branch, apply the saved plan. Uses OIDC to assume the given role
  so no long-lived AWS keys ever leave the account.
author: Mugisha Jean Claude

inputs:
  working-directory:
    description: "Directory that contains the terraform config"
    required: true
  terraform-version:
    required: false
    default: "1.9.5"
  aws-region:
    required: true
  aws-role-to-assume:
    description: "ARN of the IAM role to assume with GitHub OIDC"
    required: true
  apply-on-default-branch:
    description: "Apply the plan when the push is on the default branch"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-duration-seconds: 3600

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false

    - name: terraform fmt and validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform fmt -check -recursive
        terraform validate

    - name: terraform plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform plan -no-color -input=false -out=plan.bin | tee plan.txt
        {
          echo 'summary<<EOF'
          grep -E 'Plan:|No changes' plan.txt || echo "see plan.txt"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - if: github.event_name == 'pull_request'
      name: comment plan on PR
      uses: actions/github-script@v7
      with:
        script: |
          const summary = `#### Terraform plan in \`${{ inputs.working-directory }}\`\n\n\`\`\`\n${{ steps.plan.outputs.summary }}\n\`\`\``;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Terraform plan in'));
          if (existing) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: summary });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: summary });
          }

    - if: >
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        inputs.apply-on-default-branch == 'true'
      name: terraform apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform apply -input=false plan.bin
